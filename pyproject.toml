[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "h6distillation-to-surfacecodes"
version = "0.2.0"
description = "Notebook: Magic-H6 [[6,2,2]] distillation of two |+> states, teleported into rotated surface code blocks (via LightStim)."
requires-python = ">=3.10"
dependencies = [
    "stim>=1.15.0",
    "numpy>=1.20.0",
    # LightStim is not on PyPI. For local development against a sibling
    # checkout instead, see README.md.
    "lightstim @ git+ssh://git@github.com/maggie-bao202/LightStim.git@feat/h6-distillation-protocol",
]

[project.optional-dependencies]
notebook = [
    "matplotlib",
    "jupyter",
]

[tool.setuptools]
# Notebook-only repo: no importable package.
packages = []
